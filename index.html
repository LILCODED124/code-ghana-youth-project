<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
  <h1 class="mb-4 text-center">📊 Sales Predictor</h1>

  <form method="POST" class="card p-4 shadow-sm">
    <div class="mb-3">
      <label class="form-label">Enter Month (1-12):</label>
      <input type="number" name="month" class="form-control" min="1" max="12" required>
    </div>
    <button type="submit" class="btn btn-primary">Predict</button>
  </form>

  {% if prediction is not none %}
  <div class="alert alert-success mt-4">
    <strong>Predicted Sales:</strong> {{ prediction|round(2) }}
  </div>
  {% endif %}

  <h3 class="mt-5">📈 Sales Data</h3>
  <canvas id="salesChart" height="100"></canvas>

  <table class="table table-striped mt-4">
    <thead>
      <tr>
        <th>Month</th>
        <th>Sales</th>
      </tr>
    </thead>
    <tbody>
      {% for m, s in data %}
      <tr>
        <td>{{ m }}</td>
        <td>{{ s }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<script>
  const ctx = document.getElementById('salesChart').getContext('2d');
  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: {{ months | safe }},
      datasets: [{
        label: 'Sales by Month',
        data: {{ sales | safe }},
        borderColor: 'rgba(75, 192, 192, 1)',
        tension: 0.2,
        fill: false
      }]
    }
  });
</script>

</body>
</html>
